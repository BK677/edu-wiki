<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kayıt Ol - EduWiki</title>
    <link rel="stylesheet" href="site.css">
</head>
<body>
    <div class="auth-container">
        <div class="auth-card">
            <div class="auth-logo">
                <h1 data-i18n="siteName">EduWiki</h1>
            </div>
            
            <h2 data-i18n="register">Kayıt Ol</h2>
            
            <form id="register-form">
                <div class="form-group">
                    <label for="username" data-i18n="usernameLabel">Kullanıcı Adı *</label>
                    <input type="text" id="username" required>
                </div>
                
                <div class="form-group">
                    <label for="name" data-i18n="nameLabel">Ad Soyad *</label>
                    <input type="text" id="name" required>
                </div>
                
                <div class="form-group">
                    <label for="email" data-i18n="emailLabel">E-posta *</label>
                    <input type="email" id="email" required>
                </div>
                
                <div class="form-group">
                    <label for="password" data-i18n="passwordLabel">Şifre *</label>
                    <input type="password" id="password" required>
                </div>
                
                <div class="form-group">
                    <label for="confirm-password" data-i18n="confirmPasswordLabel">Şifre Tekrar *</label>
                    <input type="password" id="confirm-password" required>
                </div>
                
                <button type="submit" class="btn btn-primary" data-i18n="register">Kayıt Ol</button>
            </form>
            
            <p class="auth-footer">
                Zaten hesabın var mı? <a href="giris.html" data-i18n="login">Giriş Yap</a>
            </p>
        </div>
    </div>
    
    <script src="script.js"></script>
</body>
</html>
