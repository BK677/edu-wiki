<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Giriş Yap - EduWiki</title>
    <link rel="stylesheet" href="site.css">
</head>
<body>
    <div class="auth-container">
        <div class="auth-card">
            <div class="auth-logo">
                <h1 data-i18n="siteName">EduWiki</h1>
            </div>
            
            <h2 data-i18n="login">Giriş Yap</h2>
            
            <form id="login-form">
                <div class="form-group">
                    <label for="email" data-i18n="emailLabel">E-posta</label>
                    <input type="email" id="email" required>
                </div>
                
                <div class="form-group">
                    <label for="password" data-i18n="passwordLabel">Şifre</label>
                    <input type="password" id="password" required>
                </div>
                
                <button type="submit" class="btn btn-primary" data-i18n="login">Giriş Yap</button>
            </form>
            
            <p class="auth-footer">
                Hesabın yok mu? <a href="kayit.html" data-i18n="register">Kayıt Ol</a>
            </p>
        </div>
    </div>
    
    <script src="script.js"></script>
</body>
</html>
